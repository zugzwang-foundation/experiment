# .github/workflows/staging-migrate.yml
# Staging SUPABASE DB migrate — manual only (ADR-0024 items 2-3; EXT-1).
#
# ⛔ NO LONGER FIRES ON PUSH (EXT-1). From D3 a push to the `staging` branch
# fired this workflow, which applies any pending migrations to the staging
# Supabase DB via `doppler run --config stg -- pnpm db:migrate:staging`. That
# is the pre-AWS database: the staging host is served from RDS (SCOPE, below),
# and what this one's six markets carry today is not established. Migration
# 0032 is keyed on six market ids and on exact text, and none of what it could
# do here is worth a standing trigger: do nothing and still be recorded as
# applied (the committed snapshot of this database shows the same six slugs
# under OTHER ids); abort, on a partial slate or on text it was not signed
# against, and turn this workflow red on every staging push; or rewrite six
# markets in a database the staging host does not read. `workflow_dispatch`
# keeps the tool for a deliberate run. ⚠ GitHub offers a manual run only when
# the DEFAULT branch's copy of a workflow declares it, so the button appears
# once this file reaches `main`; the push trigger is gone as soon as it
# reaches `staging`. The deploy pipeline it used to belong to is
# docs/runbooks/deploy-pipeline.md §3.
#
# ⚠ SCOPE (production-readiness review HIGH-1): this migrates the SUPABASE
# staging database that the VERCEL staging deployment uses — Doppler `stg`'s
# DATABASE_URL_STAGING. It does NOT migrate the AWS staging RDS: that DSN lives
# only in Secrets Manager (`zugzwang/staging`) and the RDS is private, so it is
# migrated by `deploy-aws.yml`'s in-VPC migrate job. A green run here says
# nothing about the RDS (09-PRODUCTION-READINESS.md §D).

name: Staging Migrate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-migrate:
    name: staging-migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Refuse any ref but staging
        # `workflow_dispatch` can be started from ANY ref, and this job applies
        # the migrations of the ref it checks out. Under the `push` trigger that
        # ref was always `staging`; this keeps it so (EXT-1, the
        # `prod-title-once.yml` pattern).
        run: |
          if [ "$GITHUB_REF" != "refs/heads/staging" ]; then echo "refusing: $GITHUB_REF is not staging"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Migrate staging DB
        # Doppler injects DATABASE_URL_STAGING + STAGING_PROJECT_REF_FRAGMENT (the
        # migrate-staging.ts guard). No pg_cron strip — staging Supabase HAS the
        # extension (unlike CI's vanilla postgres:17 substrate). The stg-scoped
        # service token (OD-4) implies the project; --config stg is explicit per
        # the established operator command (memory: staging-migrate drift note).
        run: doppler run --config stg -- pnpm db:migrate:staging
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
