# ONE-OFF, PRODUCTION ONLY — remove the "3" from the Erdős market title
# (scripts/prod-title-erdos-once.ts, founder option A, 2026-10-06). Deleted
# together with that script once it has run. Pattern: staging-title-once.yml
# and the removed staging-reset-once.yml.
#
# Dispatch from `main` with mode=dry-run first (reads and reports, writes
# nothing), then mode=run. Every run waits in the `aws-production` GitHub
# environment for the required reviewer: nothing reaches production without
# that approval.
#
# No app code is deployed and no migration runs: the migration image is built
# only so its task can run the script (the command is overridden), and the
# shared `production-migrate` tag is put back to the digest it held before,
# whatever the outcome. It refuses to start while any production deploy is
# running or waiting, because both use that tag.
name: prod-title-once

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run reads and reports; run applies the single-row title update"
        required: true
        type: choice
        options: [dry-run, run]

concurrency:
  group: prod-title-once
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  title:
    name: Production title (${{ inputs.mode }})
    runs-on: ubuntu-latest
    environment: aws-production
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Refuse anything but main, and refuse while a production deploy is live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "refusing: $GITHUB_REF is not main"; exit 1; fi
          for wf in deploy-production.yml deploy-aws.yml; do
            BUSY=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --limit 20 \
              --json databaseId,status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$BUSY" != "0" ]; then
              echo "refusing: $BUSY run(s) of $wf are not completed — finish or cancel the deploy first"; exit 1
            fi
          done

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - id: previous
        name: Record the digest production-migrate holds now
        run: |
          DIGEST=$(aws ecr describe-images --repository-name zugzwang-production \
            --image-ids imageTag=production-migrate --query 'imageDetails[0].imageDigest' --output text)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then echo "no production-migrate image"; exit 1; fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "production-migrate was $DIGEST"

      - id: image
        name: Build and push the migrate image (with the one-off script)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: zugzwang-production
          TAG: title-once-${{ github.sha }}
        run: |
          docker build --target migrate -t "$REGISTRY/$REPO:$TAG" .
          docker push "$REGISTRY/$REPO:$TAG"
          docker tag "$REGISTRY/$REPO:$TAG" "$REGISTRY/$REPO:production-migrate"
          docker push "$REGISTRY/$REPO:production-migrate"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$REPO:$TAG" | sed 's/.*@//')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Run inside the VPC
        env:
          STACK: Zugzwang-production-Compute
          CLUSTER: zugzwang-production
          MODE: ${{ inputs.mode }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          out() {
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          FAMILY=$(out MigrationTaskFamily)
          SUBNETS=$(out MigrationSubnetIds)
          SG=$(out MigrationSecurityGroupId)
          CP=$(out CapacityProviderName)
          for v in FAMILY SUBNETS SG CP; do
            if [ -z "${!v}" ] || [ "${!v}" = "None" ]; then echo "missing stack output $v"; exit 1; fi
          done
          OVERRIDES=$(jq -nc --arg mode "--$MODE" \
            '{containerOverrides:[{name:"migrate",command:["pnpm","exec","tsx","scripts/prod-title-erdos-once.ts",$mode]}]}')
          RUN=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$FAMILY" \
            --capacity-provider-strategy "capacityProvider=$CP,weight=1" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides "$OVERRIDES" \
            --started-by "prod-title-once-${{ github.run_id }}" \
            --output json)
          TASK=$(echo "$RUN" | jq -r '.tasks[0].taskArn // empty')
          if [ -z "$TASK" ]; then echo "run-task placed no task:"; echo "$RUN" | jq '.failures'; exit 1; fi
          echo "task: $TASK"
          for i in 1 2 3; do
            aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK" && break
          done
          RESULT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --output json)
          STATUS=$(echo "$RESULT" | jq -r '.tasks[0].lastStatus // empty')
          CODE=$(echo "$RESULT" | jq -r '.tasks[0].containers[0].exitCode // "none"')
          RAN=$(echo "$RESULT" | jq -r '.tasks[0].containers[0].imageDigest // empty')
          echo "status=$STATUS exitCode=$CODE digest=$RAN"
          echo "task log: CloudWatch /zugzwang/production/app, stream migrate/migrate/${TASK##*/}"
          if [ "$STATUS" != "STOPPED" ]; then echo "⚠ task still $STATUS — stop it by hand"; exit 1; fi
          if [ -n "$EXPECTED_DIGEST" ] && [ "$RAN" != "$EXPECTED_DIGEST" ]; then
            echo "the task ran $RAN, not this build's $EXPECTED_DIGEST"; exit 1
          fi
          if [ "$CODE" != "0" ]; then echo "❌ the task exited $CODE (see the exit-code table in the script)"; exit 1; fi

      - name: Put production-migrate back
        if: ${{ always() && steps.previous.outputs.digest != '' }}
        env:
          PREV: ${{ steps.previous.outputs.digest }}
        run: |
          MANIFEST=$(aws ecr batch-get-image --repository-name zugzwang-production \
            --image-ids imageDigest="$PREV" --query 'images[0].imageManifest' --output text)
          MEDIA=$(aws ecr batch-get-image --repository-name zugzwang-production \
            --image-ids imageDigest="$PREV" --query 'images[0].imageManifestMediaType' --output text)
          aws ecr put-image --repository-name zugzwang-production --image-tag production-migrate \
            --image-manifest "$MANIFEST" --image-manifest-media-type "$MEDIA" > /dev/null \
            || echo "(put-image reported the tag already at that digest)"
          NOW=$(aws ecr describe-images --repository-name zugzwang-production \
            --image-ids imageTag=production-migrate --query 'imageDetails[0].imageDigest' --output text)
          echo "production-migrate is now $NOW (was $PREV)"
          [ "$NOW" = "$PREV" ] || { echo "❌ production-migrate was not restored"; exit 1; }

      - name: Production still healthy
        if: ${{ always() }}
        run: curl -fsS https://zugzwangworld.com/api/health
