# STAGING-RESET-AWS-1 — ONE-OFF. Deleted after the run
# (docs/plans/STAGING-RESET-AWS-1.md T5).
#
# Resets the LIVE staging database (RDS, private) once: capture the six live
# markets → reset → identity pool → recreate the six → open at 10/90.
# RDS is unreachable from a runner, so this rides the EXISTING staging migration
# task with a command override (`scripts/staging-reset-once.ts`), exactly as
# deploy-aws.yml runs migrations — same role, same two secrets, nothing new.
#
# ⚠ NOT workflow_dispatch: GitHub dispatches only workflows on the DEFAULT
# branch (`main`), and `main` deploys production. So the trigger is a push of
# an already-merged STAGING commit to one of two dedicated branch names — the
# branch name IS the mode, and pushing to the `-run` name IS the confirmation:
#
#   git push origin origin/staging:refs/heads/ops/staging-reset-dry-run   # reads only
#   git push origin origin/staging:refs/heads/ops/staging-reset-run       # WIPES staging
#
# The first job refuses any commit that is not on `staging`.
name: staging-reset-once

on:
  push:
    branches:
      - ops/staging-reset-dry-run
      - ops/staging-reset-run

# Shares deploy-aws.yml's staging group: a deploy re-points the same
# `staging-migrate` tag, so the two must never interleave.
concurrency:
  group: deploy-aws-staging
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  reset:
    name: Staging reset (${{ github.ref_name == 'ops/staging-reset-run' && 'run' || 'dry-run' }})
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - id: mode
        name: Refuse a commit that is not on staging
        run: |
          git fetch origin staging
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/staging; then
            echo "refusing: $GITHUB_SHA is not on staging — push an already-merged staging commit"; exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "ops/staging-reset-run" ]; then MODE=run; else MODE=dry-run; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "mode: $MODE"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - id: image
        name: Build and push the migrate image (with the reset runner)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: zugzwang-staging
          TAG: reset-once-${{ github.sha }}
        run: |
          docker build --target migrate -t "$REGISTRY/$REPO:$TAG" .
          docker push "$REGISTRY/$REPO:$TAG"
          # The migration task definition runs the stable tag. The next normal
          # staging deploy re-points it at a fresh migrate image.
          docker tag "$REGISTRY/$REPO:$TAG" "$REGISTRY/$REPO:staging-migrate"
          docker push "$REGISTRY/$REPO:staging-migrate"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$REPO:$TAG" | sed 's/.*@//')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Run the reset inside the VPC
        env:
          STACK: Zugzwang-staging-Compute
          CLUSTER: zugzwang-staging
          MODE: ${{ steps.mode.outputs.mode }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          out() {
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          FAMILY=$(out MigrationTaskFamily)
          SUBNETS=$(out MigrationSubnetIds)
          SG=$(out MigrationSecurityGroupId)
          CP=$(out CapacityProviderName)
          for v in FAMILY SUBNETS SG CP; do
            if [ -z "${!v}" ] || [ "${!v}" = "None" ]; then echo "missing stack output $v"; exit 1; fi
          done
          OVERRIDES=$(jq -nc --arg mode "--$MODE" \
            '{containerOverrides:[{name:"migrate",command:["pnpm","exec","tsx","scripts/staging-reset-once.ts",$mode]}]}')
          RUN=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$FAMILY" \
            --capacity-provider-strategy "capacityProvider=$CP,weight=1" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides "$OVERRIDES" \
            --started-by "staging-reset-once-${{ github.run_id }}" \
            --output json)
          TASK=$(echo "$RUN" | jq -r '.tasks[0].taskArn // empty')
          if [ -z "$TASK" ]; then echo "run-task placed no task:"; echo "$RUN" | jq '.failures'; exit 1; fi
          echo "task: $TASK"
          for i in 1 2 3; do
            aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK" && break
          done
          RESULT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --output json)
          STATUS=$(echo "$RESULT" | jq -r '.tasks[0].lastStatus // empty')
          CODE=$(echo "$RESULT" | jq -r '.tasks[0].containers[0].exitCode // "none"')
          RAN=$(echo "$RESULT" | jq -r '.tasks[0].containers[0].imageDigest // empty')
          echo "status=$STATUS exitCode=$CODE digest=$RAN"
          echo "--- task log (/zugzwang/staging/app, stream migrate/migrate/${TASK##*/}) ---"
          aws logs get-log-events --log-group-name /zugzwang/staging/app \
            --log-stream-name "migrate/migrate/${TASK##*/}" --start-from-head \
            --query 'events[].message' --output text || echo "(could not read the log here; read it in CloudWatch)"
          if [ "$RAN" != "$EXPECTED_DIGEST" ]; then echo "the task ran $RAN, not this build's $EXPECTED_DIGEST"; exit 1; fi
          if [ "$STATUS" != "STOPPED" ] || [ "$CODE" != "0" ]; then echo "reset task did not exit 0"; exit 1; fi

      - name: Staging still healthy
        if: ${{ steps.mode.outputs.mode == 'run' }}
        run: |
          curl -fsS https://staging.zugzwangworld.com/api/health
