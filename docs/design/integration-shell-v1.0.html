  /* if-bookmark is a SEPARATE page that reuses the profile blob (no duplicated source);
     it enters bookmark mode via the setsub:'bookmark' message the shell sends on show. */
  var FRAMES = { discovery:'discovery', d5:'d5', profile:'profile', bookmark:'profile' };
  Object.keys(FRAMES).forEach(function(id){
    var f=document.getElementById('if-'+id);
    f.addEventListener('load', function(){
      var s=desired[f.id]; if(s){ var msg={type:'setsub',sub:s}; if(desiredPost[f.id])msg.post=desiredPost[f.id];
        try{ f.contentWindow.postMessage(msg,'*'); }catch(e){} }
    });
    f.srcdoc=utf8(SRC[FRAMES[id]]);
  });
  function go(target, post){
    var m=MAP[target]; if(!m) return;
    document.querySelectorAll('.stage iframe').forEach(function(f){ f.classList.toggle('on', f.id===m.fr); });
    var f=document.getElementById(m.fr); desired[f.id]=m.sub; desiredPost[f.id]=post||null;
    var foc=function(){ try{ f.contentWindow.focus(); }catch(e){} }; foc();   /* move keyboard focus onto the shown surface so its arrow-key handler actually receives keys (you reach market from the Discovery iframe, so focus would otherwise stay there) */
    if(m.sub){ var msg={type:'setsub',sub:m.sub}; if(post)msg.post=post;
      var send=function(){ try{ f.contentWindow.postMessage(msg,'*'); }catch(e){}; foc(); }; send(); setTimeout(send,80); }
  }
  window.addEventListener('message', function(e){
    var d=e.data||{}; if(d.type!=='nav') return;
    if(d.page==='market' && d.sub==='reply') go('reply', d.post);
    else if(d.page==='market') go('market');
    else if(d.page==='bookmark') go('bookmark');
    else if(d.page==='profile') go('profile');
    else if(d.page==='discovery') go('discovery');
  });
  document.addEventListener('keydown', function(e){
    if(!/^Arrow/.test(e.key)) return;
    var a=document.querySelector('.stage iframe.on');
    if(e.key==='ArrowUp'||e.key==='ArrowDown') e.preventDefault();
    if(a && a.contentWindow){ try{ a.contentWindow.postMessage({type:'key',key:e.key},'*'); }catch(_){} }
  });
  go('discovery');
</script>
</body></html>
